site_name: ELOG Electronic Logbook
# site_url: ""
# use_directory_urls: false

nav:
  - Home: index.md
  - User guide: userguide.md
  - Admin guide: adminguide.md
  - Config file: config.md
  - FAQ: faq.md
  - Forum: forum.md
  - Wishlist: wishlist.md
  - Contributions: contrib.md
  - Demo: demo.md
  - Download info: download_info.md

repo_url: https://bitbucket.org/ritt/elog

theme:
  name: material
  logo: img/elog.png
  favicon: img/favicon.png
  icon:
    repo: fontawesome/brands/bitbucket
  features:
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - to-pdf
  - search
  - offline
  